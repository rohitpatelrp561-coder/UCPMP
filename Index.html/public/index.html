<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCPMP 2024 Compliance Chatbot</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5b6573;--bd:#d9dee5;--ac:#1a56db;--okb:#e3f6ea;--okt:#0f6b34;--rvb:#fff4d6;--rvt:#7a5200;--nob:#fde4e4;--not:#a11b1b;--ub:#1a56db}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8ebef;--mu:#9aa5b4;--bd:#323946;--ac:#6ea0ff;--okb:#14301f;--okt:#6fdc97;--rvb:#3a2f10;--rvt:#f0c56a;--nob:#3b1c1c;--not:#ff8f8f;--ub:#2c4f9e}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
header b{font-size:17px}header span{display:block;color:var(--mu);font-size:12.5px}
#log{flex:1;overflow-y:auto;padding:16px;max-width:860px;width:100%;margin:0 auto}
.msg{margin:0 0 14px;max-width:92%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.u{background:var(--ub);color:#fff;margin-left:auto}
.a{background:var(--card);border:1px solid var(--bd)}
.msg img{max-width:220px;max-height:200px;border-radius:8px;display:block;margin-bottom:6px}
.badge{display:inline-block;font-weight:700;padding:5px 12px;border-radius:8px;margin-bottom:8px}
.ok{background:var(--okb);color:var(--okt)}.rv{background:var(--rvb);color:var(--rvt)}.no{background:var(--nob);color:var(--not)}
footer{border-top:1px solid var(--bd);background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;height:44px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{border:0;border-radius:10px;padding:0 16px;height:44px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#fff}
button.sec{background:transparent;border:1px solid var(--bd);color:var(--tx)}
#prev{max-width:860px;margin:0 auto 8px;display:none;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
#prev img{height:48px;border-radius:6px}
.hint{color:var(--mu);font-size:12px;text-align:center;margin-top:6px}
</style></head><body>
<header><b>💊 UCPMP 2024 Compliance Chatbot</b><span>Upload a photo of the brand reminder / item. Advisory only – final approval rests with Compliance.</span></header>
<div id="log"></div>
<footer>
<div id="prev"><img id="pimg" alt=""><span id="pname"></span><button class="sec" id="rm" style="height:30px">Remove</button></div>
<div class="bar">
<input type="file" id="file" accept="image/*" hidden>
<button class="sec" id="attach" title="Attach image">📎</button>
<textarea id="txt" placeholder="Add details (e.g. cost ₹250, for clinic use) or ask a question…"></textarea>
<button id="send">Send</button></div>
<div class="hint">Do not upload patient data. Images are not stored by this app.</div>
</footer>
<script>
const $=id=>document.getElementById(id);
let history=[],img=null,busy=false;
function add(role,text,imgSrc){
  const d=document.createElement("div");d.className="msg "+(role==="user"?"u":"a");
  if(imgSrc){const i=document.createElement("img");i.src=imgSrc;d.appendChild(i)}
  if(role==="assistant"){
    const m=text.match(/^\s*VERDICT:\s*(.+)/i);
    if(m){const v=m[1].toUpperCase();const b=document.createElement("div");
      b.className="badge "+(v.startsWith("APPROVED")?"ok":v.startsWith("NOT")?"no":"rv");
      b.textContent=(v.startsWith("APPROVED")?"✅ ":v.startsWith("NOT")?"❌ ":"⚠️ ")+m[1].trim();
      d.appendChild(b);text=text.replace(/^\s*VERDICT:.*\n?/i,"")}
  }
  d.appendChild(document.createTextNode(text));$("log").appendChild(d);$("log").scrollTop=1e9;return d;
}
add("assistant","Hello! Upload a photo of the item (gift, brand reminder, leaflet, calendar, etc.) and I will check it against UCPMP 2024. Please also mention the unit cost in ₹ and the intended use.");
$("attach").onclick=()=>$("file").click();
$("rm").onclick=()=>{img=null;$("prev").style.display="none";$("file").value=""};
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,1568/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",0.85);
    img={mediaType:"image/jpeg",data:url.split(",")[1],url};
    $("pimg").src=url;$("pname").textContent=f.name;$("prev").style.display="flex"};im.src=r.result};
  r.readAsDataURL(f);
};
async function send(){
  if(busy)return;const text=$("txt").value.trim();
  if(!text&&!img)return;
  busy=true;$("send").disabled=true;
  const shown=text||"Review this item against UCPMP 2024.";
  add("user",shown,img&&img.url);
  history.push({role:"user",text:img?shown+"\n[An image was attached in this message.]":shown});
  const payload={messages:history,image:img?{mediaType:img.mediaType,data:img.data}:undefined};
  history[history.length-1].text=shown;
  $("txt").value="";img=null;$("prev").style.display="none";$("file").value="";
  const wait=add("assistant","Reviewing…");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const j=await r.json();wait.remove();
    if(!r.ok)throw new Error(j.error||"Error");
    history.push({role:"assistant",text:j.reply});add("assistant",j.reply);
  }catch(e){wait.remove();add("assistant","⚠️ "+e.message);history.pop()}
  busy=false;$("send").disabled=false;
}
$("send").onclick=send;
$("txt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
</script></body></html>
