services:
  - type: web
    name: ucpmp-compliance-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: VALUE_CAP_INR
        value: "1000"
